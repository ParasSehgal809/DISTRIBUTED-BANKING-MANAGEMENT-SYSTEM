{% extends "base.html" %}
{% block title %}Apply for a Loan{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 pb-4 border-b border-slate-100">
            <div class="w-8 h-8 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center">
                <i data-lucide="banknote" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900">New Loan Application</h1>
                <p class="text-xs text-slate-500">Subject to multi-branch asset aggregation and credit check.</p>
            </div>
        </div>

        <form action="{{ url_for('loan.apply_loan') }}" method="POST" class="mt-6 space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Applicant Customer *</label>
                <select name="customer_id" id="loan_customer" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-sky-500 font-sans">
                    {% for c in customers %}
                    <option value="{{ c.customer_id }}">
                        {{ c.full_name }} ({{ c.customer_id }}) &bull; Credit: {{ c.credit_score }} &bull; Branch: {{ c.branch_id }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Target Account for Loan Disbursement *</label>
                <select name="account_number" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono focus:ring-2 focus:ring-sky-500">
                    {% for a in accounts %}
                    <option value="{{ a.account_number }}">
                        {{ a.account_number }} - {{ a.customer_name }} [{{ a.branch_name }}]
                    </option>
                    {% endfor %}
                </select>
                <span class="text-[10px] text-slate-500 mt-1 block">When approved, funds are disbursed directly to this branch account.</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Requested Loan Amount ($ USD) *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-mono">$</span>
                        <input type="number" step="500" min="1000" name="requested_amount" required value="25000" class="w-full pl-7 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-mono focus:ring-2 focus:ring-sky-500 font-bold">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Tenure / Duration (Months) *</label>
                    <select name="duration_months" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-sky-500">
                        <option value="12">12 Months (1 Year)</option>
                        <option value="24">24 Months (2 Years)</option>
                        <option value="36" selected>36 Months (3 Years)</option>
                        <option value="48">48 Months (4 Years)</option>
                        <option value="60">60 Months (5 Years)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Interest Rate (% APR)</label>
                    <input type="number" step="0.1" name="interest_rate" value="6.5" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Loan Purpose *</label>
                    <input type="text" name="purpose" required value="Commercial Equipment Expansion" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-sky-500 font-sans">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4">
                <a href="{{ url_for('loan.list_loans') }}" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-xl text-xs font-medium hover:bg-slate-50">Cancel</a>
                <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow transition">
                    Submit Loan Application
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
